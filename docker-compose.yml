version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wolfiero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wolfiero}
      POSTGRES_DB: ${DB_NAME:-wolfiero}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wolfiero} -d ${DB_NAME:-wolfiero}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wolfiero
    restart: unless-stopped

  wolfiero-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-wolfiero}:${DB_PASSWORD:-wolfiero}@postgres:5432/${DB_NAME:-wolfiero}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
      # Add more env vars as needed
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # For development: bind mount the app source
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    networks:
      - wolfiero
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  openclaw-agent:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WOLFIERO_API_URL: http://wolfiero-api:8000
      WOLFIERO_API_KEY: ${WOLFIERO_API_KEY:-dev-key}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL_CHEAP: ${AI_MODEL_CHEAP:-claude-haiku-4-5-20251001}
      AI_MODEL_MID: ${AI_MODEL_MID:-claude-opus-5}
      AI_MODEL_STRONG: ${AI_MODEL_STRONG:-claude-opus-5}
      PYTHONUNBUFFERED: "1"
    # Port 8001 not exposed to host (internal only)
    depends_on:
      wolfiero-api:
        condition: service_healthy
    volumes:
      - ./openclaw/config:/app/config
      - ./openclaw/agent:/app/agent
    networks:
      - wolfiero
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  wolfiero:
    driver: bridge
