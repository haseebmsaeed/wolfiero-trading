version: "3.9"

services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    entrypoint: gcloud beta emulators firestore start --host-port 0.0.0.0:8080
    ports:
      - "8080:8080"
    networks:
      - wolfiero
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  wolfiero-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-wolfiero-dev}
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      firestore-emulator:
        condition: service_healthy
    volumes:
      # For development: bind mount the app source
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    networks:
      - wolfiero
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  openclaw-agent:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: "INFO"
      WOLFIERO_API_URL: http://wolfiero-api:8000
      WOLFIERO_API_KEY: ${WOLFIERO_API_KEY:-prod-key}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-opus-5-20250514-v1:0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      GROUNDING_GUARD_MODE: ${GROUNDING_GUARD_MODE:-log}
      PYTHONUNBUFFERED: "1"
    # Port 8001 not exposed to host (internal only)
    depends_on:
      wolfiero-api:
        condition: service_healthy
    volumes:
      - ./openclaw/config:/app/config
      - ./openclaw/agent:/app/agent
    networks:
      - wolfiero
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  wolfiero:
    driver: bridge
